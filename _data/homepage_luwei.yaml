      authors: Zhanming Jie, Jierui Li, and Wei Lu
      venue: ACL 2022
      note: "Towards system 2 learning with explainable deductive reasoning. Top 5% among all submissions according to released [ARR statistics](https://twitter.com/reviewacl?lang=en)."
      year: 2022
