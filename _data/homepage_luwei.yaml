# Wei Lu personal homepage content for the PI homepage prototypes.
#
# Source of public facts: https://statnlp.com/people/luwei/
# This is the single content source for wei-lu-homepage-a.html.
# Most text fields support Markdown links, e.g. [Google Scholar](https://scholar.google.com/).
# Local files such as photos and PDFs should live under assets/ and be referenced
# with a relative path, e.g. assets/img/people/wei-lu.png or assets/docs/wei-lu-cv.pdf.

# Browser title and meta description for the generated homepage pages.
meta:
  title: Wei Lu - BREATHE AI Lab at NTU
  description: Wei Lu, Principal Investigator of BREATHE AI Lab and Full Professor at the College of Computing and Data Science, Nanyang Technological University.

# Profile controls the first screen and the left contact card.
profile:
  display_name: Wei Lu
  role: Principal Investigator
  appointment: Full Professor
  department: College of Computing and Data Science
  institution: Nanyang Technological University
  lab: BREATHE AI Lab
  email: wei.lu@ntu.edu.sg
  website:
    label: luwei.name
    url: http://luwei.name/
  office: N4-2B-41
  contact: To be confirmed
  image:
    src: assets/img/people/wei-lu.png
    alt: Wei Lu
  cv:
    label: Curriculum Vitae
    download_label: View Full CV
    url: assets/docs/wei-lu-cv.pdf
  scholar:
    label: Google Scholar
    url: https://scholar.google.com/citations?hl=en&user=n41KN9AAAAAJ&view_op=list_works&sortby=pubdate
  focus:
    - Natural Language Processing
    - Large Language Models
    - Multilingual AI
  bio:
    - I am interested in designing mathematical models and machine learning algorithms to solve fundamental data processing problems, with a particular focus on natural language processing (NLP). My research centers on fundamental aspects of modern language models. Prior to joining NTU, I spent 12 years at the Singapore University of Technology and Design (SUTD). Before that, I worked as a postdoctoral research associate at the University of Illinois at Urbana-Champaign and completed my PhD at the Singapore-MIT Alliance of the National University of Singapore. Earlier in my academic journey, I earned my undergraduate degree with first-class honors in Computer Science from the School of Computing, National University of Singapore.

# Timeline items. `text` supports Markdown links. `note` is optional.
news:
  title: News
  items:
    - date: Sep 2025
      text: Joined the College of Computing and Data Science at Nanyang Technological University.
    - date: Apr 2025
      text: Promoted to Full Professor.
    - date: Mar 2025
      text: Thanks to [AI Singapore](https://aisingapore.org/) for awarding us a new research project under the National Multimodal LLM Program. We look forward to working together!
      note: S$4.9M
    - date: Sep 2024
      text: Awarded a new HTX industry collaboration project for the StatNLP Group.
      note: S$1.5M
    - date: Jul 2024
      text: Zhijiang Guo won the SUTD Outstanding Thesis Award.
    - date: Jun 2024
      text: Zhijiang Guo secured an Assistant Professor position at HKUST (GZ).
    - date: May 2024
      text: Guangtao Zeng secured an internship offer from MIT with Joshua Tenenbaum.
    - date: Apr 2024
      text: Honored to be appointed an ST Engineering Distinguished Professor. Thank you, [ST Engineering](https://www.stengg.com/)!
    - date: Feb 2024
      text: Excited to assume the role of Editor-in-Chief for [Computational Linguistics](https://direct.mit.edu/coli). Thank you, ACL Executive Committee, for giving me this opportunity to serve our community!
    - date: Jan 2024
      text: "Peiyuan Zhang, Guangtao Zeng, and Tianduo Wang completed pre-training of [TinyLlama](https://github.com/jzhang38/TinyLlama), which was [trending #1](https://huggingface.co/models) on Hugging Face as of 3 Jan 2024."
    - date: Dec 2023
      text: Xiaobing Sun and Jiaxi Li received an Outstanding Paper Award at EMNLP.
    - date: Jul 2023
      text: Sicong Leng won the ACL Area Chair Award, with multiple nominations; [top 1.6%](https://2023.aclweb.org/program/best_papers/) papers received nominations.
    - date: Apr 2023
      text: Recognized as a Notable Area Chair for [ICLR 2023](https://blog.iclr.cc/2023/04/05/announcing-notable-reviewers-and-area-chairs-at-iclr-2023/).
    - date: Feb 2023
      text: Jiale Han joined TU Darmstadt as a postdoc with Iryna Gurevych.
    - date: Dec 2022
      text: Allan Jie joined UNC Chapel Hill as a postdoc with Mohit Bansal.
    - date: Aug 2022
      text: Received an MOE AcRF Tier 2 Award for the StatNLP Group.
      note: S$930K
    - date: Jul 2022
      text: Xinyu Wang won the Best Paper Award at SemEval 2022.
    - date: Jun 2022
      text: The StatNLP Group's 10-year NLP research was [ranked 12th](https://csrankings.org/#/index?nlp&world) globally based on CSRankings.
    - date: May 2022
      text: Shengqiang Zhang joined LMU Munich as a PhD student with Hinrich Schutze.
    - date: Feb 2022
      text: Xinyu Wang won SemEval 2022 Task 11 in 10 out of 13 tracks.
    - date: Jan 2022
      text: Yuxiang Zhou joined Warwick University as a postdoc with Yulan He.
    - date: Jul 2021
      text: Jierui Li joined the University of Texas at Austin as a PhD student with Raymond Mooney.

