      year: 2022
    - title: "[Mixed Cross Entropy Loss for Neural Machine Translation](http://proceedings.mlr.press/v139/li21n/li21n.pdf)"
      authors: Haoran Li and Wei Lu
      venue: ICML 2021
      note: "Selected as a long oral paper; top 3% submissions; a new way of training non-standard structured prediction models."
      year: 2021
    - title: "[GraRep: Learning Graph Representations with Global Structural Information](https://dl.acm.org/doi/pdf/10.1145/2806416.2806512)"
      authors: Shaosheng Cao, Wei Lu, and Qiongkai Xu
      venue: CIKM 2015
      note: "Most cited CIKM paper within a 5-year window, twice: [2014-2019](https://scholar.google.com/citations?hl=en&vq=eng_databasesinformationsystems&view_op=list_hcore&venue=V-IMg2OTpU8J.2019), [2015-2020](https://scholar.google.com/citations?hl=en&vq=eng_databasesinformationsystems&view_op=list_hcore&venue=V-IMg2OTpU8J.2020)."
      year: 2015
    - title: "[A Probabilistic Forest-to-String Model for Language Generation from Typed Lambda Calculus Expressions](https://aclanthology.org/D11-1149.pdf)"
      authors: Wei Lu and Hwee Tou Ng
      venue: EMNLP 2011
      note: "Best Paper Award; top 0.16% submissions, 1/628."
